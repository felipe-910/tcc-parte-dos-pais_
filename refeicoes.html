<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registrar refeições — Vale das Frutas</title>
<meta name="theme-color" content="#6fa981">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="home-page">

  <div class="child-topbar">
    <a class="back" href="lista-refeicoes.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <h1 class="sticker-heading"><span class="sticker-line on-green" id="tituloRefeicao">Registrar refeições</span></h1>
    <span style="width:20px"></span>
  </div>

  <div class="child-body">
    <h2 class="sticker-line rainbow-text"><span class="rc1">T</span><span class="rc2">i</span><span class="rc3">p</span><span class="rc4">o</span><span class="rc5">s</span> <span class="rc1">d</span><span class="rc2">e</span> <span class="rc3">r</span><span class="rc4">e</span><span class="rc5">f</span><span class="rc1">e</span><span class="rc2">i</span><span class="rc3">ç</span><span class="rc4">õ</span><span class="rc5">e</span><span class="rc1">s</span></h2>

    <div class="meal-types">
      <button class="meal-type-btn meal-cafe" data-tipo="Café da manhã" type="button">
        <img class="icon-img" src="https://api.iconify.design/mdi:white-balance-sunny.svg?color=%235a4a1a" width="24" height="24" alt="">
        Café da manhã
      </button>
      <button class="meal-type-btn meal-lanche-manha" data-tipo="Lanche da manhã" type="button">
        <img class="icon-img" src="https://api.iconify.design/mdi:food-apple.svg?color=%235a1a1a" width="24" height="24" alt="">
        Lanche da manhã
      </button>
      <button class="meal-type-btn meal-almoco" data-tipo="Almoço" type="button">
        <img class="icon-img" src="https://api.iconify.design/mdi:silverware-fork-knife.svg?color=%231e3a25" width="24" height="24" alt="">
        Almoço
      </button>
      <button class="meal-type-btn meal-lanche-tarde" data-tipo="Lanche da tarde" type="button">
        <img class="icon-img" src="https://api.iconify.design/mdi:cookie.svg?color=%235a3a10" width="24" height="24" alt="">
        Lanche da tarde
      </button>
      <button class="meal-type-btn meal-janta" data-tipo="Janta" type="button">
        <img class="icon-img" src="https://api.iconify.design/mdi:weather-night.svg?color=%23241a4d" width="24" height="24" alt="">
        Janta
      </button>
    </div>

    <div class="search-wrap">
      <input class="search-input" id="buscarAlimento" type="text" placeholder="Buscar alimento..." autocomplete="off">
      <div class="search-suggestions" id="sugestoes" hidden></div>
    </div>

    <p class="food-list-label">Alimentos adicionados</p>
    <div class="food-list" id="foodList"></div>
    <p class="empty-note" id="emptyFoodNote">Nenhum alimento adicionado ainda.</p>

    <button class="cta" id="salvarBtn" type="button">Salvar refeições</button>
  </div>

  <div class="toast" id="toast"></div>

<script src="app.js"></script>
<script type="module">
  import { watchAuthState } from './auth.js';
  import { addRefeicao, updateRefeicao } from './refeicoes.js';

  watchAuthState((user) => {
    if (!user) window.location.href = 'login.html';
  });

  const raw = sessionStorage.getItem('filhoAtivo');
  if (!raw) window.location.href = 'home.html';
  const filho = raw ? JSON.parse(raw) : null;

  const edicaoRaw = sessionStorage.getItem('refeicaoEdicao');
  const refeicaoEmEdicao = edicaoRaw ? JSON.parse(edicaoRaw) : null;
  if (refeicaoEmEdicao) {
    document.getElementById('tituloRefeicao').textContent = 'Editar refeição';
  }

  let tipoSelecionado = refeicaoEmEdicao ? refeicaoEmEdicao.tipo : null;
  const tipoBtns = document.querySelectorAll('.meal-type-btn');
  tipoBtns.forEach((btn) => {
    if (refeicaoEmEdicao && btn.dataset.tipo === refeicaoEmEdicao.tipo) {
      btn.classList.add('selected');
    }
    btn.addEventListener('click', () => {
      tipoBtns.forEach((b) => b.classList.remove('selected'));
      btn.classList.add('selected');
      tipoSelecionado = btn.dataset.tipo;
    });
  });

  // Carrega o catálogo de alimentos (com ícones) do alimentos.json
  let catalogo = [];
  fetch('alimentos.json').then((r) => r.json()).then((dados) => { catalogo = dados; }).catch(() => { catalogo = []; });

  const alimentos = refeicaoEmEdicao ? [...refeicaoEmEdicao.alimentos] : []; // { nome, icone }
  const foodList = document.getElementById('foodList');
  const emptyFoodNote = document.getElementById('emptyFoodNote');
  const buscarInput = document.getElementById('buscarAlimento');
  const sugestoes = document.getElementById('sugestoes');

  function renderAlimentos() {
    foodList.innerHTML = '';
    emptyFoodNote.style.display = alimentos.length ? 'none' : 'block';
    alimentos.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'food-item';
      row.innerHTML = `
        <span class="food-icon"><img class="icon-img" src="${iconUrl(item.icone || 'mdi:food-variant', '6fa981')}" width="18" height="18" alt=""></span>
        <span class="food-name"></span>
        <button class="icon-action edit" type="button" aria-label="Editar"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M11 2L14 5L5 14H2V11L11 2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
        <button class="icon-action delete" type="button" aria-label="Remover"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 4H13M6 4V2.5H10V4M4.5 4L5 14H11L11.5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      `;
      row.querySelector('.food-name').textContent = item.nome;
      row.querySelector('.edit').addEventListener('click', () => {
        const novo = prompt('Editar alimento:', item.nome);
        if (novo && novo.trim()) {
          alimentos[idx] = { nome: novo.trim(), icone: item.icone };
          renderAlimentos();
        }
      });
      row.querySelector('.delete').addEventListener('click', () => {
        alimentos.splice(idx, 1);
        renderAlimentos();
      });
      foodList.appendChild(row);
    });
  }
  renderAlimentos();

  function adicionarAlimento(item) {
    alimentos.push(item);
    buscarInput.value = '';
    esconderSugestoes();
    renderAlimentos();
  }

  function esconderSugestoes() {
    sugestoes.hidden = true;
    sugestoes.innerHTML = '';
  }

  buscarInput.addEventListener('input', () => {
    const termo = buscarInput.value.trim().toLowerCase();
    if (!termo) { esconderSugestoes(); return; }
    const resultados = catalogo.filter((f) => f.nome.toLowerCase().includes(termo)).slice(0, 6);
    if (!resultados.length) { esconderSugestoes(); return; }
    sugestoes.innerHTML = '';
    resultados.forEach((f) => {
      const opt = document.createElement('button');
      opt.type = 'button';
      opt.className = 'suggestion-item';
      opt.innerHTML = `<img class="icon-img" src="${iconUrl(f.icone, '6fa981')}" width="18" height="18" alt=""><span>${f.nome}</span>`;
      opt.addEventListener('click', () => adicionarAlimento({ nome: f.nome, icone: f.icone }));
      sugestoes.appendChild(opt);
    });
    sugestoes.hidden = false;
  });

  buscarInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const nome = buscarInput.value.trim();
      if (!nome) return;
      const match = catalogo.find((f) => f.nome.toLowerCase() === nome.toLowerCase());
      adicionarAlimento(match ? { nome: match.nome, icone: match.icone } : { nome, icone: 'mdi:food-variant' });
    }
  });

  document.addEventListener('click', (e) => {
    if (!sugestoes.contains(e.target) && e.target !== buscarInput) esconderSugestoes();
  });

  document.getElementById('salvarBtn').addEventListener('click', async () => {
    if (!tipoSelecionado) {
      showToast('Escolha o tipo de refeição.');
      return;
    }
    if (!alimentos.length) {
      showToast('Adicione pelo menos um alimento.');
      return;
    }
    if (!filho) {
      showToast('Selecione um pequeno primeiro.');
      return;
    }
    try {
      if (refeicaoEmEdicao) {
        await updateRefeicao(refeicaoEmEdicao.id, { tipo: tipoSelecionado, alimentos });
      } else {
        await addRefeicao({ filhoId: filho.id, tipo: tipoSelecionado, alimentos });
      }
      sessionStorage.removeItem('refeicaoEdicao');
      window.location.href = 'lista-refeicoes.html';
    } catch (err) {
      console.error(err);
      showToast('Não foi possível salvar a refeição.');
    }
  });
</script>
</body>
</html>
