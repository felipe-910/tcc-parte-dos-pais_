<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu perfil — Vale das Frutas</title>
<meta name="theme-color" content="#6fa981">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="home-page">

  <div class="child-topbar">
    <a class="back" href="home.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <h1 class="sticker-heading"><span class="sticker-line on-green">Meu perfil</span></h1>
    <span style="width:20px"></span>
  </div>

  <div class="child-body">

    <div class="profile-avatar-wrap">
      <div class="profile-avatar" id="avatar"></div>
      <button class="profile-avatar-cam" id="avatarCamBtn" type="button" aria-label="Trocar foto">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l2-2h6l2 2h3v11H4V8z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.2" stroke="#fff" stroke-width="2"/></svg>
      </button>
      <input type="file" id="avatarFileInput" accept="image/*" hidden>
    </div>
    <p class="profile-name-line" id="nomeUsuario">Carregando...</p>
    <p class="profile-email-line" id="emailUsuario"></p>

    <button class="cta" id="editarPerfilBtn" type="button">Editar perfil</button>

    <!-- Modo visualização -->
    <div class="profile-info-card" id="infoCard">
      <div class="profile-info-row">
        <span class="row-icon"><img class="icon-img" src="https://api.iconify.design/mdi:account-outline.svg?color=%236fa981" width="22" height="22" alt=""></span>
        <span class="row-text">
          <span class="row-label">Nome completo:</span>
          <span class="row-value" id="rowNome">—</span>
        </span>
        <span class="row-chevron">&#8250;</span>
      </div>
      <div class="profile-info-row">
        <span class="row-icon"><img class="icon-img" src="https://api.iconify.design/mdi:email-outline.svg?color=%236fa981" width="22" height="22" alt=""></span>
        <span class="row-text">
          <span class="row-label">E-mail:</span>
          <span class="row-value" id="rowEmail">—</span>
        </span>
        <span class="row-chevron">&#8250;</span>
      </div>
      <div class="profile-info-row">
        <span class="row-icon"><img class="icon-img" src="https://api.iconify.design/mdi:phone-outline.svg?color=%236fa981" width="22" height="22" alt=""></span>
        <span class="row-text">
          <span class="row-label">Telefone:</span>
          <span class="row-value" id="rowTelefone">Não informado</span>
        </span>
        <span class="row-chevron">&#8250;</span>
      </div>
      <a class="profile-info-row" href="termos.html" style="text-decoration:none;cursor:pointer;">
        <span class="row-icon"><img class="icon-img" src="https://api.iconify.design/mdi:file-document-outline.svg?color=%236fa981" width="22" height="22" alt=""></span>
        <span class="row-text">
          <span class="row-label">Termos de uso</span>
          <span class="row-value">Ler termos de uso</span>
        </span>
        <span class="row-chevron">&#8250;</span>
      </a>
    </div>

    <!-- Modo edição -->
    <form class="profile-edit-form" id="editForm" hidden novalidate>
      <div class="field">
        <label for="novoNome">Nome completo</label>
        <input id="novoNome" name="novoNome" type="text" placeholder="Seu nome" minlength="2" required>
        <span class="error">Digite um nome válido.</span>
      </div>
      <div class="field">
        <label for="emailCampo">E-mail</label>
        <input id="emailCampo" type="email" disabled>
      </div>
      <div class="field">
        <label for="novoTelefone">Telefone</label>
        <input id="novoTelefone" name="novoTelefone" type="tel" placeholder="(11) 99999-9999">
      </div>
      <button class="cta" type="submit">Salvar alterações</button>
      <button class="btn btn-outline" id="cancelarEdicaoBtn" type="button" style="margin-top:12px;">Cancelar</button>
    </form>

    <div class="profile-danger-zone">
      <button class="btn-danger" id="deleteBtn" type="button">Excluir conta</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="app.js"></script>
<script type="module">
  import { watchAuthState, updateUserProfile, deleteAccount, logoutUser, traduzErro } from './auth.js';

  const avatarEl = document.getElementById('avatar');
  const nomeEl = document.getElementById('nomeUsuario');
  const emailEl = document.getElementById('emailUsuario');
  const rowNome = document.getElementById('rowNome');
  const rowEmail = document.getElementById('rowEmail');
  const rowTelefone = document.getElementById('rowTelefone');
  const novoNomeInput = document.getElementById('novoNome');
  const emailCampo = document.getElementById('emailCampo');
  const novoTelefoneInput = document.getElementById('novoTelefone');

  const infoCard = document.getElementById('infoCard');
  const editForm = document.getElementById('editForm');
  const editarPerfilBtn = document.getElementById('editarPerfilBtn');

  let uid = null;

  function telefoneKey() {
    return uid ? `perfil_telefone_${uid}` : null;
  }
  function fotoKey() {
    return uid ? `perfil_foto_${uid}` : null;
  }

  // Redimensiona a imagem escolhida antes de salvar (evita guardar arquivos enormes)
  function redimensionarImagem(file, tamanhoMax = 240) {
    return new Promise((resolve, reject) => {
      const leitor = new FileReader();
      leitor.onerror = () => reject(new Error('Não foi possível ler a imagem.'));
      leitor.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Arquivo de imagem inválido.'));
        img.onload = () => {
          const escala = Math.min(1, tamanhoMax / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * escala);
          canvas.height = Math.round(img.height * escala);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = leitor.result;
      };
      leitor.readAsDataURL(file);
    });
  }

  // Protege a tela: só quem está logado pode ver
  watchAuthState((user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    uid = user.uid;
    const nome = user.displayName || 'Sem nome cadastrado';
    nomeEl.textContent = nome;
    emailEl.textContent = user.email || '';
    rowNome.textContent = nome;
    rowEmail.textContent = user.email || '—';
    novoNomeInput.value = user.displayName || '';
    emailCampo.value = user.email || '';

    const fotoSalva = localStorage.getItem(fotoKey());
    if (fotoSalva) {
      avatarEl.style.backgroundImage = `url('${fotoSalva}')`;
    } else if (user.photoURL) {
      avatarEl.style.backgroundImage = `url('${user.photoURL}')`;
    }

    const telefoneSalvo = localStorage.getItem(telefoneKey());
    if (telefoneSalvo) {
      rowTelefone.textContent = telefoneSalvo;
      novoTelefoneInput.value = telefoneSalvo;
    }
  });

  function abrirEdicao() {
    infoCard.hidden = true;
    editarPerfilBtn.hidden = true;
    editForm.hidden = false;
  }
  function fecharEdicao() {
    infoCard.hidden = false;
    editarPerfilBtn.hidden = false;
    editForm.hidden = true;
  }

  editarPerfilBtn.addEventListener('click', abrirEdicao);
  document.getElementById('cancelarEdicaoBtn').addEventListener('click', fecharEdicao);
  const avatarFileInput = document.getElementById('avatarFileInput');
  document.getElementById('avatarCamBtn').addEventListener('click', () => {
    avatarFileInput.click();
  });
  avatarFileInput.addEventListener('change', async () => {
    const file = avatarFileInput.files[0];
    avatarFileInput.value = '';
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      showToast('Escolha um arquivo de imagem.');
      return;
    }
    try {
      const dataUrl = await redimensionarImagem(file);
      if (fotoKey()) localStorage.setItem(fotoKey(), dataUrl);
      avatarEl.style.backgroundImage = `url('${dataUrl}')`;
      showToast('Foto atualizada!');
    } catch (err) {
      console.error(err);
      showToast('Não foi possível atualizar a foto.');
    }
  });

  attachFormValidation(editForm, async () => {
    const novoNome = novoNomeInput.value.trim();
    const novoTelefone = novoTelefoneInput.value.trim();
    try {
      await updateUserProfile({ nome: novoNome });
      nomeEl.textContent = novoNome;
      rowNome.textContent = novoNome;
      if (telefoneKey()) {
        if (novoTelefone) {
          localStorage.setItem(telefoneKey(), novoTelefone);
          rowTelefone.textContent = novoTelefone;
        } else {
          localStorage.removeItem(telefoneKey());
          rowTelefone.textContent = 'Não informado';
        }
      }
      showToast('Perfil atualizado!');
      fecharEdicao();
    } catch (err) {
      showToast(traduzErro(err.code));
    }
  });

  document.getElementById('deleteBtn').addEventListener('click', async () => {
    const confirmar = confirm('Tem certeza que deseja excluir sua conta? Essa ação não pode ser desfeita.');
    if (!confirmar) return;
    try {
      await deleteAccount();
      showToast('Conta excluída.');
      setTimeout(() => { window.location.href = 'index.html'; }, 1000);
    } catch (err) {
      showToast(traduzErro(err.code));
      if (err.code === 'auth/requires-recent-login') {
        setTimeout(() => { window.location.href = 'login.html'; }, 1800);
      }
    }
  });
</script>
</body>
</html>
